<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<rect width="960" height="440" fill="#ffffff"/>
<text x="40" y="42" font-size="21" font-weight="bold" fill="#111827">hello.df 逐段解剖</text>
<rect x="40.0" y="74" width="124.8" height="40" rx="5" fill="#fde68a"/><text x="42.0" y="108" font-family="Consolas, monospace" font-size="26" fill="#78350f">DFI4main</text><rect x="164.8" y="74" width="15.6" height="40" rx="5" fill="#fecaca"/><text x="166.8" y="108" font-family="Consolas, monospace" font-size="26" fill="#7f1d1d">0</text><rect x="180.4" y="74" width="15.6" height="40" rx="5" fill="#ddd6fe"/><text x="182.4" y="108" font-family="Consolas, monospace" font-size="26" fill="#4c1d95">,</text><rect x="196.0" y="74" width="78.0" height="40" rx="5" fill="#bfdbfe"/><text x="198.0" y="108" font-family="Consolas, monospace" font-size="26" fill="#1e3a8a">F3PRT</text><rect x="274.0" y="74" width="140.4" height="40" rx="5" fill="#bbf7d0"/><text x="276.0" y="108" font-family="Consolas, monospace" font-size="26" fill="#14532d">hello DF9</text><rect x="414.4" y="74" width="15.6" height="40" rx="5" fill="#ddd6fe"/><text x="416.4" y="108" font-family="Consolas, monospace" font-size="26" fill="#4c1d95">;</text><rect x="430.0" y="74" width="62.4" height="40" rx="5" fill="#fde68a"/><text x="432.0" y="108" font-family="Consolas, monospace" font-size="26" fill="#78350f">RET0</text><rect x="492.4" y="74" width="15.6" height="40" rx="5" fill="#ddd6fe"/><text x="494.4" y="108" font-family="Consolas, monospace" font-size="26" fill="#4c1d95">'</text>
<rect x="40" y="177" width="15" height="15" rx="3" fill="#fde68a"/><text x="64" y="190" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">DFI4main</tspan>  Define Function Int：返回 int，名字长 4，名字 main</text><rect x="40" y="223" width="15" height="15" rx="3" fill="#fecaca"/><text x="64" y="236" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">0</tspan>  参数个数 0</text><rect x="40" y="269" width="15" height="15" rx="3" fill="#ddd6fe"/><text x="64" y="282" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">,</tspan>  多语句函数体开始</text><rect x="40" y="315" width="15" height="15" rx="3" fill="#bfdbfe"/><text x="64" y="328" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">F3PRT</tspan>  F + 长度 3 + 关键字 PRT：打印</text><rect x="500" y="177" width="15" height="15" rx="3" fill="#bbf7d0"/><text x="524" y="190" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">hello DF9</tspan>  裸文本原样输出，直到 ;</text><rect x="500" y="223" width="15" height="15" rx="3" fill="#ddd6fe"/><text x="524" y="236" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">;</tspan>  语句结束</text><rect x="500" y="269" width="15" height="15" rx="3" fill="#fde68a"/><text x="524" y="282" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">RET0</tspan>  返回 0</text><rect x="500" y="315" width="15" height="15" rx="3" fill="#ddd6fe"/><text x="524" y="328" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#1f2937"><tspan font-family="Consolas, monospace" fill="#0f172a">'</tspan>  函数体结束</text>
<line x1="40" y1="382" x2="920" y2="382" stroke="#e5e7eb"/>
<text x="40" y="410" font-size="14" fill="#b91c1c">长度写错不会报“长度错误”：它会把后面的 ( 、; 、' 一起吃进名字里，然后在更远的地方报 unknown variable。</text>
</svg>