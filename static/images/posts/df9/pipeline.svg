<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/></marker></defs>
<rect width="960" height="320" fill="#ffffff"/>
<text x="40" y="42" font-size="21" font-weight="bold" fill="#111827">从 .df 到可执行文件</text>
<rect x="20" y="110" width="150" height="90" rx="12" fill="#dbeafe" stroke="#1e3a8a" stroke-opacity="0.35"/><text x="95.0" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a8a">hello.df</text><text x="95.0" y="176" text-anchor="middle" font-size="13" fill="#1e3a8a">DF9 源码</text><rect x="220" y="110" width="170" height="90" rx="12" fill="#fde68a" stroke="#78350f" stroke-opacity="0.35"/><text x="305.0" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#78350f">df9.exe</text><text x="305.0" y="176" text-anchor="middle" font-size="13" fill="#78350f">单遍编译器</text><rect x="440" y="110" width="140" height="90" rx="12" fill="#dcfce7" stroke="#166534" stroke-opacity="0.35"/><text x="510.0" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#166534">hello.s</text><text x="510.0" y="176" text-anchor="middle" font-size="13" fill="#166534">AT&amp;T 汇编</text><rect x="630" y="110" width="140" height="90" rx="12" fill="#e0e7ff" stroke="#3730a3" stroke-opacity="0.35"/><text x="700.0" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#3730a3">gcc / as</text><text x="700.0" y="176" text-anchor="middle" font-size="13" fill="#3730a3">汇编 + 链接</text><rect x="820" y="110" width="130" height="90" rx="12" fill="#fee2e2" stroke="#7f1d1d" stroke-opacity="0.35"/><text x="885.0" y="150" text-anchor="middle" font-size="19" font-weight="bold" fill="#7f1d1d">hello.exe</text><text x="885.0" y="176" text-anchor="middle" font-size="13" fill="#7f1d1d">可执行文件</text><line x1="170" y1="155" x2="212" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/><line x1="390" y1="155" x2="432" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/><line x1="580" y1="155" x2="622" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/><line x1="770" y1="155" x2="812" y2="155" stroke="#6b7280" stroke-width="2" marker-end="url(#arw)"/>
<text x="220" y="240" font-size="13" fill="#6b7280">1101 行 C++17 · 递归下降 · 无 AST / IR / 优化</text>
<text x="820" y="240" font-size="13" fill="#6b7280">运行时：getchar / putchar / puts / pthread</text>
<text x="40" y="292" font-size="14" fill="#374151">编译器只输出汇编；剩下的交给 GCC 和系统 ABI。错误只给 pos，不给你行号。</text>
</svg>