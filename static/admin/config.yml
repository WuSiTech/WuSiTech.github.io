# ==============================================================================
# 后台配置（Sveltia CMS，兼容 Decap CMS / Netlify CMS 的 config.yml 格式）
#
# 入口： https://wusitech.github.io/admin/   （镜像： https://wstk.pages.dev/admin/ ）
# 内容仍然以 Markdown 存在 Git 仓库里，后台保存 = 直接提交到 main 分支，
# 提交后 GitHub Actions 自动构建部署，和手动改文件完全等价。
#
# ⚠️ 使用前必须做一次性配置（详见 docs/后台与评论部署指南.md）：
#    1. 建一个 GitHub OAuth App
#    2. 用仓库里的 tools/cms-oauth-worker/worker.js 部署一个 Cloudflare Worker
#    3. 把下面 backend.base_url 换成该 Worker 地址
# ==============================================================================

backend:
  name: github
  repo: WuSiTech/WuSiTech.github.io
  branch: main
  # GitHub 登录中转（Cloudflare Worker，免费）；已部署并回填
  base_url: https://wusitech-cms-auth.2739715775.workers.dev

# 本地调试：在电脑上跑 `npx decap-server` 后，用 hugo server 打开
# http://localhost:1313/admin/ 即可免登录直接写入本地文件（线上不生效）。
local_backend: true

# 保存即提交（不做 PR 审核流）
publish_mode: simple

# 关掉 Decap 的实时预览（Hugo 短代码在预览里显示不准，容易误会）
editor:
  preview: false

site_url: https://wusitech.github.io/
display_url: https://wusitech.github.io/
logo_url: https://wusitech.github.io/avatar/avatar.webp

# 图片：上传进 static/images/uploads/，正文里用 /images/uploads/xxx.webp 引用
# 提示：webp 压缩可以用仓库里的 tools/img2webp.py，比后台直传的 PNG 小很多
media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  # ---------------------------------------------------------------- 文章
  - name: posts
    label: 文章
    label_singular: 一篇文章
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    # 文章用 +++ TOML；不写这行的话，Sveltia 会把「新建」的文章存成 YAML
    # front matter（存量文件会自动识别，不受影响）
    format: toml-frontmatter
    sortable_fields: [date, title]
    summary: "{{title}}  ·  {{date}}"
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: date
        widget: datetime
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        format: "YYYY-MM-DDTHH:mm:ssZ" # 与现有文章一致：2026-10-14T22:30:00+08:00
        input_timezone: Asia/Shanghai # 避免时区漂移
      - label: 草稿
        name: draft
        widget: boolean
        default: true
        hint: 草稿不会出现在站点上；写好后再关掉
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 首页卡片与搜索结果里显示的简介
      - label: 分类
        name: categories
        widget: list
        required: false
        default: ["STM32"]
        hint: 已存在的分类：STM32（新分类会自动生成分类页，首页卡片要在 params.yml 的 home_categories 里加）
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 首页缩略图（cover）
        name: cover
        widget: image
        required: false
        hint: 首页卡片/列表用，建议 1200×760 的 webp
      - label: 文章页顶部大图（banner）
        name: banner
        widget: image
        required: false
        hint: 留空则用站点默认 banner
      - label: 正文
        name: body
        widget: markdown

  # ---------------------------------------------------------------- 固定页面
  - name: pages
    label: 页面
    files:
      - name: about
        label: 关于页
        file: content/about.md
        format: yaml-frontmatter
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 简介, name: description, widget: string, required: false }
          - label: 日期
            name: date
            widget: datetime
            date_format: "YYYY-MM-DD"
            time_format: "HH:mm:ss"
            format: "YYYY-MM-DDTHH:mm:ssZ"
            input_timezone: Asia/Shanghai
          - { label: 正文, name: body, widget: markdown }

      - name: friend
        label: 友情链接页
        file: content/friend.md
        format: yaml-frontmatter
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 简介, name: description, widget: string, required: false }
          - label: 日期
            name: date
            widget: datetime
            date_format: "YYYY-MM-DD"
            time_format: "HH:mm:ss"
            format: "YYYY-MM-DDTHH:mm:ssZ"
            input_timezone: Asia/Shanghai
          - { label: 正文, name: body, widget: markdown }

# ---------------------------------------------------------------- 说明
# 1) 站点级配置（config/_default/params.yml：菜单、首页分类、主题参数等）没有放进
#    后台，因为 CMS 保存时会按表单字段重写整个文件，会把未声明的配置项丢掉。
#    要改这些请直接在 GitHub 网页上编辑：
#    https://github.com/WuSiTech/WuSiTech.github.io/edit/main/config/_default/params.yml
#
# 2) 友情链接数据（data/friends.yml）目前是一个空的 YAML 列表，也没有放进后台：
#    等要加友链时手动按文件里的注释格式追加即可。
#
# 3) 只有仓库的 collaborator 才能通过后台写入（Sveltia 登录时会校验仓库写权限），
#    再加上 Worker 里的 ALLOWED_GITHUB_USERS 白名单，双重限制。
