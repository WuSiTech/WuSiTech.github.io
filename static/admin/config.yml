site_url: https://wstk.pages.dev/admin

backend:
  name: turbo-github
  repo: WuSiTech/WuSiTech.github.io
  branch: main

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: posts
    label: 博客文章
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "文章摘要(summary)", name: "summary", widget: "text", required: false }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "categories", widget: "list", required: false }
      - { label: "是否草稿", name: "draft", widget: "boolean", default: false }
      - { label: "Cover首页卡片图", name: "cover", widget: "string", default: "auto", required: false }
      - { label: "Banner文章顶部大图", name: "banner", widget: "string", default: "images/banner.webp", required: false }
      - { label: "正文", name: "body", widget: "markdown" }

  - name: pages
    label: 独立页面
    files:
      - name: about
        label: About关于页
        file: "content/about.md"
        fields:
          - { label: "标题", name: "title", widget: "string" }
          - { label: "正文", name: "body", widget: "markdown" }
