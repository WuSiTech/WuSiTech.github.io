# ==============================================================================
# 后台配置（Sveltia CMS，兼容 Decap CMS / Netlify CMS 的 config.yml 格式）
#
# 入口： https://wusitech.github.io/admin/   （镜像： https://wstk.pages.dev/admin/ ）
# 内容仍然以 Markdown 存在 Git 仓库里，后台保存 = 直接提交到 main 分支，
# 提交后 GitHub Actions 自动构建部署，和手动改文件完全等价。
#
# ⚠️ 使用前必须做一次性配置（详见 docs/后台与评论部署指南.md）：
#    1. 建一个 GitHub OAuth App
#    2. 用仓库里的 tools/cms-oauth-worker/worker.js 部署一个 Cloudflare Worker
#    3. 把下面 backend.base_url 换成该 Worker 地址
# ==============================================================================

backend:
  name: github
  repo: WuSiTech/WuSiTech.github.io
  branch: main
  # GitHub 登录中转（Cloudflare Worker，免费）；已部署并回填
  base_url: https://wusitech-cms-auth.2739715775.workers.dev

# 本地调试：在电脑上跑 `npx decap-server` 后，用 hugo server 打开
# http://localhost:1313/admin/ 即可免登录直接写入本地文件（线上不生效）。
local_backend: true

# 保存即提交（不做 PR 审核流）
publish_mode: simple

# 关掉 Decap 的实时预览（Hugo 短代码在预览里显示不准，容易误会）
editor:
  preview: false

site_url: https://wusitech.github.io/
display_url: https://wusitech.github.io/
logo_url: https://wusitech.github.io/avatar/avatar.webp

# 图片库：指向站点图片的家目录 static/images（不是某个 uploads 子目录）。
#   - 后台「选择图片 → 全局资源」里能直接看到 static/images 下的全部图片和子目录
#     （banner.webp、stm32/… 等），可以挑现成的图当封面或正文插图，不必先上传。
#   - 新上传的图片会落在 static/images/ 根目录（想归档就自己在后台「新建文件夹」，
#     例如 stm32），插入后路径自动写成 /images/xxx.webp，与站内现有用法一致。
#   - 站点里其它目录的图片（例如 static/avatar/avatar.webp）不在这里显示，属正常。
# 提示：webp 压缩可以用仓库里的 tools/img2webp.py，比后台直传的 PNG 小很多
media_folder: static/images
public_folder: /images

# 关掉后台媒体对话框里的外链图库（Pexels / Pixabay / Unsplash / Lorem Picsum）。
# 本站硬性约束：运行时不得依赖被墙/外部资源（tools/check_site.py 会拦外部资源），
# 这些图库要联网拉境外 API，必须全关。
# 依据（static/admin/sveltia-cms.js 里内置的配置 schema，Sveltia 0.241.0）：
#   StockAssetProviderName:{type:`string`,enum:[`pexels`,`picsum`,`pixabay`,`unsplash`]}
#   MediaLibraries:{type:`object`,properties:{…,
#     stock_assets:{anyOf:[{type:`boolean`,const:!1},{$ref:`#/definitions/StockMediaLibrary`}]}},
#     additionalProperties:!1}
# 运行时：IZ=({fieldConfig:e}={})=>{let t=eF({libraryName:`stock_assets`,…});
#         if(t===!1)return{providers:[]}; …}
# 即 stock_assets: false 会让提供者列表为空，「外链图库」分组整块不渲染。
#「输入 URL」（外部位置）保留：它由字段的 choose_url 控制（默认 true），
# 不影响站点默认行为，站长偶尔需要贴外链。
media_libraries:
  # 关掉后台媒体对话框里的外链图库（Pexels / Pixabay / Unsplash / Lorem Picsum）。
  # 本站硬性约束：运行时不依赖外部资源（tools/check_site.py 会拦），这些图库要联网拉境外 API，必须全关。
  # 注意：不要在这里写 config/transformations（写法不符 schema 会让整个后台打不开）；
  #       上传的图片转 WebP 由 .github/workflows/webp.yml 在推送后自动完成。
  stock_assets: false
collections:
  # ---------------------------------------------------------------- 文章
  - name: posts
    label: 文章
    label_singular: 一篇文章
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    # 文章用 +++ TOML；不写这行的话，Sveltia 会把「新建」的文章存成 YAML
    # front matter（存量文件会自动识别，不受影响）
    format: toml-frontmatter
    sortable_fields: [date, title]
    summary: "{{title}}  ·  {{date}}"
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 发布日期
        name: date
        widget: datetime
        default: "{{now}}"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm:ss"
        format: "YYYY-MM-DDTHH:mm:ssZ" # 与现有文章一致：2026-10-14T22:30:00+08:00
        input_timezone: Asia/Shanghai # 避免时区漂移
      - label: 草稿
        name: draft
        widget: boolean
        default: true
        hint: 草稿不会出现在站点上；写好后再关掉
      - label: 摘要
        name: description
        widget: text
        required: false
        hint: 首页卡片与搜索结果里显示的简介
      - label: 分类
        name: categories
        widget: list
        required: false
        default: ["STM32"]
        hint: 已存在的分类：STM32（新分类会自动生成分类页；要在首页显示分类卡片，去「站点设置 → 首页分类卡片」里加一条）
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      # 封面图：改成下拉框，选项来自 media 孤儿分支的封面原图（374 张）。
      # 选项不手写 —— .github/workflows/sync-cover-pool.yml 在 media 分支 push 后
      # 会自动把清单写入下面的 COVER_OPTIONS 标记区（只替换标记区内容）。
      # ⚠️ 手改标记区会被下一次自动同步覆盖；要加图请往 media 分支 images/pool/covers/ 提交。
      - label: 封面图
        name: cover
        widget: select
        required: false
        options:
          # ===== COVER_OPTIONS_BEGIN（自动生成，勿手改）=====
          # 封面候选（自动生成，勿手改）——来源 media 分支，共 374 张
          - /images/pool/covers/covers-01.avif
          - /images/pool/covers/covers-02.avif
