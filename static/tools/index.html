<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>WuSiTools</title>
<style>
  :root{
    --bg:#ffffff;
    --fg:#1f2328;
    --muted:#656d76;
    --line:#e6e8eb;
    --card:#f6f8fa;
    --hover:#eef1f4;
    --accent:#0969da;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117;
      --fg:#e6edf3;
      --muted:#8b949e;
      --line:#21262d;
      --card:#161b22;
      --hover:#1c2128;
      --accent:#4493f8;
    }
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    padding:56px 20px 72px;
    background:var(--bg);
    color:var(--fg);
    font:15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
         "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  main{max-width:720px;margin:0 auto}

  h1{
    margin:0 0 8px;
    font-size:22px;
    font-weight:600;
    letter-spacing:-.01em;
  }

  .desc{
    margin:0 0 36px;
    color:var(--muted);
    font-size:14px;
  }

  /* 分组标题 */
  h2{
    margin:36px 0 12px;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.06em;
  }
  h2:first-of-type{margin-top:0}

  /* 链接列表 */
  .links{
    list-style:none;
    margin:0;
    padding:0;
    display:grid;
    gap:8px;
  }

  .links li a{
    display:block;
    padding:14px 16px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--fg);
    text-decoration:none;
    transition:background .15s, border-color .15s;
  }
  .links li a:hover{
    background:var(--hover);
    border-color:var(--accent);
  }

  .title{
    display:block;
    font-weight:500;
  }
  .links li a:hover .title{
    color:var(--accent);
  }

  .note{
    display:block;
    margin-top:2px;
    font-size:13px;
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* 页脚 */
  footer{
    margin-top:48px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--muted);
  }
</style>
</head>
<body>
<main>

  <h1>WuSiTools</h1>
  <p class="desc">工具DAZE</p>

  <!-- ================= 复制加链接 =================

     <h2>分组名称</h2>
     <ul class="links">
       <li>
         <a href="https://example.com" target="_blank" rel="noopener">
           <span class="title">链接标题</span>
           <span class="note">可选的说明文字，不需要就删掉这行</span>
         </a>
       </li>
     </ul>

     · href 写完整网址或相对路径
     · target="_blank" 表示新标签页打开，不需要就删掉
     · .note 那一行可删，只留 .title 也能用
     · h2 是分组标题，不需要分组就直接把 li 放进一个 ul 里

     ========================================================== -->
<h2>文件工具</h2>
     <ul class="links">
       <li>
         <a href="/tools/encryptor/index.html" target="_blank" rel="noopener">
           <span class="title">WuSi Simple Encryptor</span>
           <span class="note">吾思简快加密工具网页版本</span>
         </a>
       </li>
     </ul>

  <footer>页面源码可自由复制~</footer>

</main>
</body>
</html>
