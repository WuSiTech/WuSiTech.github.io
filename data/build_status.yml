# 构建状态（供右下角「构建状态」挂件显示）
# ---------------------------------------------------------------------------
# 这个文件是**默认值**：本地构建（hugo / hugo server）没有 CI 环境时就读它，
# 页面上两个胶囊会显示成灰色的「未知」。
#
# CI（.github/workflows/hugo.yaml 的 “Collect build status” 步骤）会在
# `hugo` 构建之前用脚本 **覆盖写入** 本文件（不提交），所以线上显示的才是真实状态。
# 因此渲染逻辑必须容忍本文件缺失或字段为空，缺了也只显示「未知」，不能报错。
#
# 字段说明：
#   status      当前这次 “Build and deploy” 运行的结论：success | failure | cancelled | skipped | running | unknown
#   checked_at  状态采集时间（ISO 8601，带时区）；空字符串表示“没采到数据”
#   commit      触发本次运行的提交短 SHA
#   href        该工作流的 Actions 页面
#   workflows   另一个工作流（Tools and config checks）的最近一次结论
status: unknown
checked_at: ""
commit: ""
workflows:
  build_and_deploy:
    name: Build and deploy
    status: unknown
    conclusion: ""
    href: https://github.com/WuSiTech/WuSiTech.github.io/actions/workflows/hugo.yaml
  tools_and_config_checks:
    name: Tools and config checks
    status: unknown
    conclusion: ""
    href: https://github.com/WuSiTech/WuSiTech.github.io/actions/workflows/tools.yml
