########################################
# Basic Configuration
########################################

# image lightbox (点击文章图片放大查看)
fancybox: true

# main menu navigation
# ⚠️ 菜单已搬到 config/_default/params.toml（后台「站点设置」集合管理）。
# 两点容易踩坑，改之前先看那里文件头的说明：
#   1) params.toml 里表名不能再写 params. 前缀，要写 [menu] / [[menu]]；
#   2) 每项 name 是 i18n 键（home / archives / categories / tags / friend / about），
#      主题用 {{ i18n .name }} 渲染，填中文网页上会变成空白。

# friend links
friends:
  shuffle: false  # whether to shuffle the friend links

# Must match the actual content folder name (content/posts -> "posts"),
# otherwise the home list and the archives page render zero articles.
mainSections: ["posts"]

# 年，月，日及时间的格式化样式
# Format style for year,month,date & time
yearFormat: "2006"
monthFormat: "2006-01"
dateFormat: "2006-01-02"
timeFormat: "2006-01-02 15:04:05"

# author / email / description / avatar / social 这五项（个人信息）
# 已搬到 config/_default/params.toml（后台「站点设置」集合管理），
# 这里不再定义，避免两处打架 —— 同一个键在 params.toml 和 params.yml 里
# 都写会以其中一个为准，很难排查。

# subtitle: "DA☆ZE"
subtitle:
  typing:
    enable: false
    strings:
      # - Sentence 1
      # - Sentence 2
      # - Sentence 3
      # - Sentence 4
    typeSpeed: 100              # 打字速度（毫秒/字符）
    backSpeed: 50               # 删除速度（毫秒/字符）
    backDelay: 2000             # 打完一句话后，等待时间
    startDelay: 300             # 页面加载后，等待时间
    loop: true                  # 是否循环播放
    shuffle: true               # 是否随机输出句子
    showCursor: true            # 是否显示闪烁的字符
    cursorChar: "|"             # 字符
    smartBackspace: false       # 智能退格，只删除不同的部分
  text: "BAKA DA☆ZE!"          # 当 typing.enable = false 时使用

banner: "images/banner.webp"
# You can also write it in the form of the following url
# banner: "https://example.com"

# If you want to use the srcset attribute, please enable it
banner_srcset:
  enable: true
  srcset:
    - src: "images/banner-600w.webp"
      media: "(max-width: 479px)"
    - src: "images/banner-800w.webp"
      media: "(max-width: 799px)"
    - src: "images/banner.webp"
      media: "(min-width: 800px)"

# 头像（avatar）已搬到 config/_default/params.toml

# Control the display of the post cover
# If not set, the banner image will be displayed by default
# Its priority is lower than the cover in the Front-matter
cover: # https://example.com / false / rgb(255,117,117)

# Control the display of the post toc
# Its priority is lower than the toc in the Front-matter
toc: true

# Open Graph
open_graph:
  enable: true
  options:
    #twitter_card: <twitter:card>
    #twitter_id: <twitter:creator>
    #twitter_site: <twitter:site>
    #twitter_image: <twitter:image>
    #google_plus: <g+:profile_link>
    #fb_admins: <fb:admin_id>
    #fb_app_id: <fb:app_id>

# Content
excerpt_link: Read More

# Footer copyright
# Inject code snippet right in the footer copyright
# Make sure your code snippet is safeHTML
copyright:
# Need help choosing? Please see...
# https://creativecommons.org/choose/
# https://choosealicense.com/
# copyright: |-
#   <div style="flex-direction:column;align-items: center;"><a rel="license" href="http://creativecommons.org/licenses/by/4.0/"><img alt="Creative Commons License" style="border-width:0" src="https://i.creativecommons.org/l/by/4.0/88x31.png" /></a>
#   All website licensed under <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a></div>

footer:
  since: 2020 # 2020-current year
  powered: true
  count: true
  busuanzi: false  # 关闭页脚「总访问量 / 总访客量」（同时不再加载脚本）
  icon:
    url: "../images/taichi.png" # this path is relative to the css/main.css, so it needs to go up one level to reach the images folder
    rotate: true
    mask: true # whether to use the images as a mask

# Sidebar
sidebar:
  position: right
  menu: true  # whether to show the sidebar menu button, ignored on mobile devices
  article:
    show_common: true # whether to show common sidebar, ignored on mobile devices

# social（社交链接）已搬到 config/_default/params.toml —— 注意那边用的是
# 「列表」写法（每项 name + url），不是这里原来的「键: 值」映射写法。
# 主题两种写法都支持；完整图标名清单见 themes/reimu/README.md 的 social 一节。

widgets:
  - category
  - tagcloud
  - recent_posts

# Widget behavior
category_limits: 10
tag_limits: 10
recent_posts_limits: 5
tagcloud_limits: 20

# Archive behavior
only_show_capsule_in_index: false # If you have huge amounts of tags and categories, you can set this to true to only show the capsule in the index page for better performance
uppercase_capsule: true # If you want to keep taxonomic capsule unchanged, please set this to false

show_update_time: false # If you want to show the update time, please set this to true

# Summary content
summary:
  enable: false
  style: "subtitle" # 'subtitle' or 'blockquote'

# RSS output
rss:
  limit: 10             # The number of recent articles to be output, write -1 to output all
  showFullContent: false # output full content or description
  showCopyright: false   # If true, add copyright to the end of article.

# Sort order configuration
# Available values: default, date, date-reverse, weight, weight-reverse
sort_order:
  taxonomy:
    category: date-reverse # controlled by categories_weight
    tag: date-reverse # controlled by tags_weight
  archive: date-reverse # controlled by weight
  home: default # controlled by weight

# Pagination
paginate:
  archive: # Number of posts per page in archive and taxonomy pages
  post: # Number of posts per page in home and other list pages

########################################
# CSS
########################################

layout:
  max_width: 1350px # the max width of the main content area

triangle_badge:
  enable: true
  icon: github # same as the icon in the social config
  link: https://github.com/WuSiTech

anchor_icon: # default use '#' icon, you can use a hexadecimal representation of fontawesome or icon_font, like 'f0c1', you can also use false to hide anchor icon

reimu_cursor:
  enable: true
  cursor:
    default: ../images/cursor/reimu-cursor-default.png  # this path is relative to the css/main.css, so it needs to go up one level to reach the images folder
    pointer: ../images/cursor/reimu-cursor-pointer.png
    text: ../images/cursor/reimu-cursor-text.png

icon_font: 4552607_ex15nbittbh

# Font loading strategy
# Custom Font -> Google Fonts -> Local FallBack Font

# Custom Font
custom_font:
  enable: false
  article:
    # - css: https://fontsapi.zeoseven.com/292/main/result.css # font css
    #   name: LXGW WenKai # font name
  code:

# https://fonts.google.com/
# Google Fonts, higher priority than local_font
font:
  # ⚠️ 关闭：国内无法访问 fonts.googleapis.com / fonts.gstatic.com，
  # 而且它是 <head> 里的渲染阻塞样式表，会让整页等到超时。
  # 关掉后使用下面的 local_font 系统字体（Win 上是微软雅黑，macOS 上是苹方），速度快且无外部请求。
  enable: false
  article:
    - Mulish
    - Noto Serif SC
  code:
    # - Ubuntu Mono
    # - Source Code Pro
    # - JetBrains Mono

# Local FallBack Font
local_font:
  article:
    - "-apple-system"
    - PingFang SC
    - Microsoft YaHei
    - sans-serif
  code:
    - Menlo
    - Monaco
    - Consolas
    - monospace

dark_mode:
  # true means that the dark mode toggle button is shown
  # false means that the dark mode toggle button is hidden
  button: true # true | false
  # true means that the dark mode is enabled by default
  # false means that the dark mode is disabled by default
  # auto means that the dark mode is automatically switched according to the system settings
  type: auto # true | false | auto

########################################
# Analytics
########################################

baidu_analytics: false   # 原本是 true（被当成站点 ID，生成 hm.js?true，无效）；填真实 ID 才会生效
google_analytics: false  # 关闭：www.googletagmanager.com 国内不可达；要统计建议用百度统计或 Cloudflare Web Analytics
clarity: false

########################################
# Markdown Display
########################################

# mermaid url https://github.com/mermaid-js/mermaid
mermaid:
  zoom: false # whether to enable zoom for mermaid diagrams

code_block:
  # whether to expand the code block by default
  # true means expand all code blocks by default
  # false means collapse all code blocks by default
  # number means collapse the code block by default when the number of lines exceeds the specified value
  expand: true

# Clipboard configuration
clipboard:
  success:
    en: Copy successfully (*^▽^*)
    zh-CN: 复制成功 (*^▽^*)
    zh-TW: 複製成功 (*^▽^*)
    ja: コピー成功 (*^▽^*)
    pt-BR: Copiado com sucesso (*^▽^*)
  fail:
    en: Copy failed (ﾟ⊿ﾟ)ﾂ
    zh-CN: 复制失败 (ﾟ⊿ﾟ)ﾂ
    zh-TW: 複製失敗 (ﾟ⊿ﾟ)ﾂ
    ja: コピー失敗 (ﾟ⊿ﾟ)ﾂ
    pt-BR: Falha ao copiar (ﾟ⊿ﾟ)ﾂ
  copyright:
    enable: false
    count: 50 # The number of characters when the copyright is displayed
    license_type: by-nc-sa # https://creativecommons.org/licenses

math:
  katex:
    enable: false
  mathjax:
    enable: false
    options: # see https://docs.mathjax.org/en/latest/web/configuration.html
    # we need to put the configuration in an array, because hugo will automatically convert the key to lowercase
      -
        tex:
          tags: "ams"
          useLabelIds: true
          inlineMath: [["$", "$"], ["\\(", "\\)"]]
          displayMath: [["$$", "$$"], ["\\[", "\\]"]]
          processEscapes: true
          processEnvironments: true
          autoload:
            color: []
            colorv2: ["color"]
          packages:
            "[+]": ["noerrors"]
        options:
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
          ignoreHtmlClass: "tex2jax_ignore"
          processHtmlClass: "tex2jax_process"
        loader:
          load: ["input/asciimath", "[tex]/noerrors"]

# Paragraph anchor
# Injects linkable anchor icons into paragraphs and list items in article body
# Usage: write {#anchor-xxx} in Markdown; the matching element gets id="anchor-xxx" and an anchor icon
anchor:
  # Explicit anchors
  explicit:
    # Whether to enable explicit anchors: parse {#anchor-xxx} syntax in Markdown (default false)
    enable: false
    # Anchor placeholder: the pattern used to match explicit anchors (no need to change unless it conflicts with article content)
    marker: "{#anchor-"
    # Anchor id prefix: generated id = prefix + the xxx part inside the marker (default "anchor-")
    prefix: "anchor-"
  # Auto anchors
  auto:
    # Whether to enable auto anchors: automatically generate ids for direct child paragraphs, derived from text content (default false)
    enable: false
    # Maximum length of auto-generated anchor ids; longer ids will be truncated (only effective when auto.enable = true)
    length: 60

########################################
# Comment system
########################################

# global control of the comment system
# you can use multiple comment systems at the same time
# load order: localStorage(user manually selects) -> default
# -> valine -> waline -> twikoo -> gitalk -> giscus -> utterances -> beaudar -> disqus
comment:
  # comment system title
  title:
    en: Leave a comment
    zh-CN: 说些什么吧！
    zh-TW: 說些什麼吧！
    ja: コメントを残す
    pt-BR: Deixe um comentário
  default: twikoo # default comment system, when you enable multiple comment systems

# valine comment system. https://valine.js.org
valine:
  enable: false
  appId: # leancloud application app id
  appKey: # leancloud application app key
  pageSize: 10
  avatar: mp # gravatar style https://valine.js.org/#/avatar
  placeholder: Just go go
  guest_info: nick,mail,link
  recordIP: true
  highlight: true
  visitor: false
  serverURLs: # leancloud server url

# https://waline.js.org/
waline:
  enable: false
  serverURL:
  locale: {} # https://waline.js.org/guide/features/i18n.html
  emoji:
    - https://npm.webcache.cn/@waline/emojis@1.2.0/weibo
    - https://npm.webcache.cn/@waline/emojis@1.2.0/alus
    - https://npm.webcache.cn/@waline/emojis@1.2.0/bilibili
    - https://npm.webcache.cn/@waline/emojis@1.2.0/qq
    - https://npm.webcache.cn/@waline/emojis@1.2.0/tieba
    - https://npm.webcache.cn/@waline/emojis@1.2.0/tw-emoji
  meta:
    - nick
    - mail
    - link
  requiredMeta:
    - nick
    - mail
  wordLimit: 0
  pageSize: 10
  pageview: true

# https://twikoo.js.org
# 后端方案：Netlify（免费额度充足，官方文档标注"中国大陆访问速度不错"）
#         + MongoDB Atlas 免费版存数据；部署步骤见 README 的「评论系统」一节。
# 前端：static/resources/twikoo@2.0.15/（本地自托管，不走任何第三方 CDN）
# 评论已改为自建 Git 存储方案，见 docs/评论系统（Git存储）.md —— 因此这里关闭 Twikoo
twikoo:
  enable: false # 已关闭；下面的配置行原样保留，方便需要时切回
  envId: # ← 部署好 Netlify 后把云函数地址填这里，例如 https://xxx.netlify.app/.netlify/functions/twikoo
  region: # ← Netlify / Vercel 部署留空；只有腾讯云 CloudBase 才需要（如 ap-shanghai）

# https://github.com/gitalk/gitalk/blob/master/readme-cn.md
gitalk:
  enable: false
  clientID:
  clientSecret:
  repo:
  owner:
  admin:
  md5: false

# https://giscus.app/zh-CN
giscus:
  enable: false
  repo:
  repoId:
  category:
  categoryId:
  mapping: mapping
  strict: 0
  reactionsEnabled: 1
  emitMetadata: 0
  inputPosition: bottom
  theme:
    light:
    dark:

# https://disqus.com
disqus:
  enable: false
  shortname: # your disqus shortname
  count: true

# https://utteranc.es
utterances:
  enable: false
  repo: owner/repo # Change this to "Your GitHub Username/The Repository Name"
  issue_term: title
  theme: auto

# https://beaudar.lipk.org/
beaudar:
  enable: false
  repo: owner/repo # Change this to "Your GitHub Username/The Repository Name"
  branch: main
  issue_term: title
  issue_number:
  theme: auto
  label:
  input_position: top
  comment_order: desc
  keep_theme:
  loading:

########################################
# Search
########################################

algolia_search:
  enable: false
  appID:
  apiKey:
  indexName:
  hits:
    per_page: 10

########################################
# Animation
########################################

preloader:
  enable: true
  text:
    zh-CN: 少女祈祷中...
    zh-TW: 少女祈禱中...
    en: Loading...
    ja: 少女祈祷中...
    pt-BR: Carregando...
  icon: # default use inline svg for fast speed, you can use a image url, like '/images/taichi.png'
  rotate: true # whether to rotate the icon

# see https://github.com/D-Sketon/aos.js
animation:
  enable: true
  options:
    header:
      title: slide-up
      subTitle: slide-down
    home:
      post: fade-up
      widget: fade-up
      sidebar: fade-up
    article:
      whole: fade-up
      date: zoom-in
      category: zoom-in
      tag: zoom-in
      comment: zoom-in
      reading: zoom-in
      nav: fade-up
    archive:
      whole: fade-up
      tag: zoom-in
      category: zoom-in
      section: fade-up
      nav: fade-up

# see https://github.com/D-Sketon/mouse-firework
firework:
  enable: true
  disable_on_mobile: false
  options:
    excludeElements: ["a", "button"]
    particles:
      - shape: circle
        move: ["emit"]
        easing: easeOutExpo
        colors: ["var(--red-1)", "var(--red-2)", "var(--red-3)", "var(--red-4)"]
        number: 20
        duration: [1200, 1800]
        shapeOptions:
          radius: [16, 32]
          alpha: [0.3, 0.5]
      - shape: circle
        move: ["diffuse"]
        easing: easeOutExpo
        colors: ["var(--red-0)"]
        number: 1
        duration: [1200, 1800]
        shapeOptions:
          radius: 20
          alpha: [0.2, 0.5]
          lineWidth: 6

