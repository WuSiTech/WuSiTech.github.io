# show categories card on home page
# ⚠️ 首页分类卡片（home_categories）已搬到 config/_default/params.toml
# （后台「站点设置」集合管理），要在网页首页加/删分类卡片可以直接在后台做。

########################################
# Experimental features
########################################

# Inject code snippet
# Make sure your code snippet is safeHTML
injector:
  head_begin: # Inject code snippet right after <head>
  # 代码块配色微调：主题把 .n(变量/宏/结构体成员)、.no(常量) 等一大批 Name 类
  # 统一涂成 --highlight-comment（注释灰），导致整段代码只有一种颜色；而标点、
  # 运算符又没设色、继承了更亮的正文色，看起来反而比代码本身更显眼。
  # 这里用主题自带的 --highlight-* 变量重新分配，亮/暗模式各自生效。
  head_end: |
    <style>
      /* 变量 / 宏 / 结构体成员：改用正文色，不再和注释同色 */
      .article-entry .chroma .n,
      .article-entry .chroma .nx,
      .article-entry .chroma .nn,
      .article-entry .chroma .fm,
      .article-entry .chroma .py {
        color: var(--highlight-foreground);
      }
      /* 函数名、常量名 */
      .article-entry .chroma .nf,
      .article-entry .chroma .no {
        color: var(--highlight-blue);
      }
      /* 运算符：与关键字一起构成代码骨架 */
      .article-entry .chroma .o {
        color: var(--highlight-red);
      }
      /* 标点保持正文色 */
      .article-entry .chroma .p {
        color: var(--highlight-foreground);
      }
      /* 隐藏顶部导航右侧的 RSS 按钮（订阅源 /index.xml 仍然保留可用） */
        display: none;
      }
    </style>
  body_begin: # Inject code snippet right after <body>
  # 1) Fancybox 灯箱：配合 render-image.html 输出的 <a data-fancybox="gallery">，
  #    点击文章图片时弹出放大层而不是跳转到图片地址。
  # 2) 头像立即加载：主题输出 <img class="lazyload" data-src="...">（没有 src），
  #    要等 lazysizes 运行后才有 src；CSS 里 .sidebar-author img{opacity:0}
  #    只有补上 .lazyloaded 才显示。这里在 DOM 就绪前同步设好 src 并切好 class。
  body_end: |
    <!-- Fancybox 灯箱所需资源已本地化到 static/vendor/，不再依赖 cdn.jsdelivr.net（国内经常超时） -->
    <link rel="stylesheet" href="/vendor/fancybox/fancybox-3.5.7.min.css" />
    <script src="/vendor/jquery/jquery-3.7.1.min.js"></script>
    <script src="/vendor/fancybox/fancybox-3.5.7.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        if (window.jQuery && jQuery.fn.fancybox) {
          jQuery('[data-fancybox="gallery"]').fancybox({
            buttons: ["zoom", "close"]
          });
        }
      });
    </script>
    <script>
      (function () {
        var imgs = document.querySelectorAll(".sidebar-author img.lazyload[data-src]");
        for (var i = 0; i < imgs.length; i++) {
          var img = imgs[i];
          if (img.getAttribute("src")) continue;
          img.setAttribute("src", img.getAttribute("data-src"));
          img.setAttribute("loading", "eager");
          img.classList.remove("lazyload");
          img.classList.add("lazyloaded");
        }
      })();
    </script>
    <!-- 自建评论系统：读 static/comments/<slug>.json，提交到 Cloudflare Pages Function（详见 docs/评论系统（Git存储）.md） -->
    <script>(function(){var _p=location.pathname;if(!(_p.indexOf("/posts/")===0||_p.indexOf("/about/")===0||_p.indexOf("/friend/")===0||_p.indexOf("/download/")===0))return;var a=document.querySelector(".article-entry");if(!a)return;var s=document.createElement("script");s.src="/js/comments.js?v=11";s.defer=true;document.body.appendChild(s);})();</script>
      <!-- 站内本地搜索：索引 /index.json，零外部请求 -->
