# ---------------------------------------------------------------------------
# 站点基础配置（对应 Hugo 项目根目录那个被忽略的 hugo.toml）
#
# ⚠️ 本仓库用的是 config/_default/ 目录式配置：一旦存在这个目录，
# Hugo 就**只读这里**，不再读项目根目录的 hugo.toml（`hugo config` 可验证）。
# 原来的 baseURL / title / theme 等一直写在根目录 hugo.toml 里，
# 是因为那些键在下面的站点配置里也没有，靠 Hugo 的默认值 + params 撑住了；
# 为了让配置来源唯一，这里把根目录那几项显式搬过来（值保持完全一致）。
#
# 另外这里定义了「构建状态」挂件要用的 JSON 输出格式（末尾两节）。
# ---------------------------------------------------------------------------

baseURL: "https://wusitech.github.io/"
locale: "zh-cn"
title: "吾思 梦阁"
theme: "reimu"

# 生成 robots.txt，让搜索引擎爬虫自动发现 sitemap.xml（模板见 layouts/robots.txt）
enableRobotsTXT: true

# 主题新增的配置
mainSections: ["posts"]          # 文章所在目录（content/posts）
author: "吾思"
description: "思集成之大道，考计科之行踪"
subtitle: "DAZE~"                # 副标题

# ⚠️ 不要用 baseURL = '/' + relativeURLs = true：
# sitemap.xml 里的 <loc>、以及 canonical / og:url 都必须是绝对地址，
# 否则搜索引擎拿到的是 "/posts/xxx/" 这种相对地址，无法正确收录。
# 本地预览无需为此改配置：hugo server 会自动用 http://localhost:1313/ 覆盖 baseURL。
canonifyURLs: false

# 代码块高亮：主题要求用 class 模式，否则 Hugo 会用 Monokai 内联样式
# （背景 #272822），与主题 CSS 的 --highlight-foreground 冲突导致代码看不清
markup:
  highlight:
    guessSyntax: true
    noClasses: false

# ---------------------------------------------------------------------------
# 输出格式：右下角「构建状态」挂件的数据文件（/build-status.json）
#
# 为什么需要：injector（config/_default/params.yml）里的内容是**纯文本**，
# Hugo 不会把里面的 {{ ... }} 当模板执行，所以状态数据没法从 injector 里
# 直接渲染；改成构建时把 data/build_status.yml 渲染成一个静态 JSON，
# 再由 static/js/build-status.js 读取并填进挂件外壳（同源请求，无外部依赖）。
#
# 模板：layouts/_default/single.buildstatus.json
# 触发：content/buildstatus.md 的 front matter `outputs: [buildstatus]`
# 详见 docs/构建状态挂件.md
# ---------------------------------------------------------------------------

# application/json 是 Hugo 内置媒体类型，这里显式写一遍是为了让配置文件自解释
mediaTypes:
  application/json:
    suffixes:
      - json

outputFormats:
  buildstatus:
    mediaType: application/json
    baseName: build-status
    isPlainText: true      # 纯文本模板，不要套 baseof.html
    notAlternative: true   # 不要出现在 <link rel="alternate"> 里
