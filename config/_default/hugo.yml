# ---------------------------------------------------------------------------
# 站点基础配置（对应 Hugo 项目根目录那个被忽略的 hugo.toml）
#
# ⚠️ 本仓库用的是 config/_default/ 目录式配置：一旦存在这个目录，
# Hugo 就**只读这里**，不再读项目根目录的 hugo.toml（`hugo config` 可验证）。
# 原来的 baseURL / title / theme 等一直写在根目录 hugo.toml 里，
# 是因为那些键在下面的站点配置里也没有，靠 Hugo 的默认值 + params 撑住了；
# 为了让配置来源唯一，这里把根目录那几项显式搬过来（值保持完全一致）。
#
# 另外这里定义了「构建状态」挂件要用的 JSON 输出格式（末尾两节）。
# ---------------------------------------------------------------------------

# 站点规范地址统一写 GitHub Pages 域名。
# 自定义域名 wstek.win 仍然指向 GitHub Pages（static/CNAME 保持 wstek.win 不动），
# 访问 wusitech.github.io 会 301 到 wstek.win，两个地址都能用；
# 这样以后换域名时只要改这一处（以及 static/CNAME）。
baseURL: "https://wusitech.github.io/"
locale: "zh-cn"
title: "吾思 梦阁"
theme: "reimu"

# 生成 robots.txt，让搜索引擎爬虫自动发现 sitemap.xml（模板见 layouts/robots.txt）
enableRobotsTXT: true

# 主题新增的配置
mainSections: ["posts"]          # 文章所在目录（content/posts）
author: "吾思"
description: "思集成之大道，考计科之行踪"
subtitle: "DAZE~"                # 副标题

# ⚠️ 不要用 baseURL = '/' + relativeURLs = true：
# sitemap.xml 里的 <loc>、以及 canonical / og:url 都必须是绝对地址，
# 否则搜索引擎拿到的是 "/posts/xxx/" 这种相对地址，无法正确收录。
# 本地预览无需为此改配置：hugo server 会自动用 http://localhost:1313/ 覆盖 baseURL。
canonifyURLs: false

# 代码块高亮：主题要求用 class 模式，否则 Hugo 会用 Monokai 内联样式
# （背景 #272822），与主题 CSS 的 --highlight-foreground 冲突导致代码看不清
markup:
  highlight:
    guessSyntax: true
    noClasses: false

# ---------------------------------------------------------------------------
# 全站随机固定背景：把「页面默认 banner」关掉
#
# 背景由 static/js/wusi-bg.js + static/css/wusi-bg.css 负责：
#   · 文章页 front matter 里**显式写了 banner** → 用它当整屏固定背景（cover 不算，cover 只是卡片缩略图）；
#   · 没写 banner 的页面（包括有 cover 的文章、首页/关于/友链…）→ 用随机图源。
# 主题原来的行为是"没有自定义 banner 就渲染站点默认 banner.webp"，
# 这张 155KB 的图现在不显示（被整屏背景替代）却仍会被浏览器下载，
# 所以用 cascade 把页面级 banner 默认值设为 false：主题于是不再输出那个 <img>，
# 省掉一次没必要的图片请求。文章 front matter 里显式写的 banner 优先级更高，
# 不受这里影响（这也是文章页还能用自己 banner 的原因）。
# ---------------------------------------------------------------------------
cascade:
  - params:
      banner: false

# ---------------------------------------------------------------------------
# 页底「BLOG状态」固定条不需要任何输出格式 / 构建期数据：
# 它引用的两张徽章是 static/badges/*.svg（README 顶部那两张 GitHub Actions
# 徽章的镜像，由 .github/scripts/fetch_badges.py 在 CI 构建前下载，仓库里也提交了
# 兜底副本），状态本身就写在 SVG 里。以前的 buildstatus JSON 输出格式
# （content/buildstatus.md + layouts/_default/single.buildstatus.json +
#  data/build_status.yml + static/js/build-status.js）已整条删除，
# 详见 docs/构建状态挂件.md。
# ---------------------------------------------------------------------------

# 站内搜索：首页额外输出 /index.json（供 static/js/search.js 使用，不请求任何外部资源）
outputs:
  home: [HTML, RSS, JSON]
