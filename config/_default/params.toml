# ==============================================================================
# 站点设置 —— 菜单 / 个人信息 / 首页分类卡片
#
# 后台入口：https://wusitech.github.io/admin/  →  「站点设置」
# 后台字段定义：static/admin/config.yml 里的 site 集合（file 指向本文件）
#
# 为什么单独放一个文件：
#   params.yml 有 750 多行，里面还有站长手调的代码高亮配色 CSS、注入脚本、
#   评论系统等一大批设置。Sveltia CMS 保存时会按表单里【声明的字段】重写整个
#   文件，让后台直接管 params.yml 就会把没声明的配置整段丢掉，所以只把这三块
#   搬到这里。Hugo 会把 params.toml 与 params.yml 合并进同一个 params 键，
#   站点行为不变（已实测，并用搬家前后的构建产物逐字节 diff 验证过）。
#
# ⚠️ 三条规矩（改之前先读）：
#   1) 这里只放这三块。别的参数留在 params.yml —— 后台管不到，也就不会被重写。
#   2) 新加字段必须同步在 static/admin/config.yml 的 site 集合里声明，
#      否则下次在后台保存时会被丢掉（评论集合踩过这个坑）。
#   3) 本文件的表名【不要】加 params. 前缀：
#      params.toml 这个文件本身就等价于 params 这一层，
#      写 [menu] 才是 params.menu；写成 [params.menu] 会变成 params.params.menu，
#      站点读不到菜单（已实测）。后台保存时也是按这个规则写的。
#      另外：在后台保存过一次之后，本文件里的注释会被 CMS 抹掉，这是正常的。
# ==============================================================================

# ---------------------------------------------------------------- 个人信息

# 作者名：页脚版权、侧边栏作者名、<title> 后缀、文章页 meta article:author 都用它
author = "WuSi"

# 作者邮箱：目前只用于 RSS（/index.xml）的 author 字段；留空即可
email = ""

# 站点简介：侧边栏作者名下方那行字，同时是 <meta name="description"> 的兜底
description = "BAKA DA☆ZE!"

# 头像文件名：图片放在 static/avatar/ 下，这里只写文件名
avatar = "avatar.webp"

# 社交链接：当前为空（与搬家前一致，页面上不显示任何社交图标）。
# 主题同时支持「列表」和「映射」两种写法，这里用列表，方便后台增删：
#   social = [{ name = "github", url = "https://github.com/WuSiTech" }]
# name 用主题支持的图标名：github / bilibili / zhihu / weibo / email / qq /
#   twitter / telegram / youtube / steam ...（写错不会报错，只是不显示图标）
social = []

# ---------------------------------------------------------------- 菜单
# ⚠️ name 不是显示文字，而是 i18n 键！
#    主题用 {{ i18n .name }} 渲染导航文字（见 themes/reimu/layouts/partials/
#    header.html 第 23 行，以及 sidebar/commonBar.html 第 69、88 行），
#    所以这里填「首页」这类中文，网页上的导航文字会变成空白。
#    可用键（themes/reimu/i18n/zh-CN.yml）：
#      home=首页  archives=归档  categories=分类  tags=标签  friend=友链  about=关于
#    url 写相对路径（不带开头的 / 也行，主题会自动解析），空 "" 表示站点根目录；
#    不要在 url 里写域名。
#    icon 留空 = 用主题默认图标；也可以填 fontawesome 十六进制码（如 f0c1），
#    或图片路径（如 /avatar/avatar.webp）。
#    数组顺序 = 网页上从左到右的顺序。
[[menu]]
name = "home"
url = ""

[[menu]]
name = "archives"
url = "archives"

[[menu]]
name = "categories"
url = "categories"

[[menu]]
name = "tags"
url = "tags"

[[menu]]
name = "friend"
url = "friend"

[[menu]]
name = "about"
url = "about"

# ---------------------------------------------------------------- 首页分类卡片
# 只写「已经存在」的分类（分类由文章的 categories 自动生成）；
# 这里没列出的分类不会显示卡片，但分类页 /categories/ 依旧可以访问。
[home_categories]
enable = true

[[home_categories.content]]
categories = "STM32"
cover = "images/stm32/interrupt-path.webp"
