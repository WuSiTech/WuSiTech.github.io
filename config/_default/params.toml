# ==============================================================================
# 站点设置 —— 个人信息 / 菜单 / 首页分类卡片
#
# 后台入口：https://wusitech.github.io/admin/   →「站点设置」
# 后台字段定义：static/admin/config.yml 里的 site 集合（file 指向本文件）
#
# ⚠️ 本文件【整体】交给后台管：Sveltia 保存时会按表单里【声明过的字段】重写整个
#    文件 —— 注释会被抹掉（正常现象，见下面的说明），没声明的键也会被丢掉。
#    所以：这里只放「站点设置」里声明过的字段，其余参数留在 config/_default/
#    params.yml（那里面有代码高亮配色、注入脚本、评论系统等，刻意不交给后台）。
#    新加字段必须同步声明到 static/admin/config.yml 的 site 集合。
#    （Hugo 会把 params.toml 与 params.yml 合并进同一个 params 键，站点行为不变。）
#
# ------------------------------------------------- 菜单怎么改（站长自助，不用改本文件）
#   ⚠️ 菜单项的 name 不是显示文字，而是 i18n【键名】；真正的文字在项目级
#      i18n/zh-CN.yml 里，后台对应「站点设置 → 站点文案」。
#      主题模板是 {{ i18n .name }}（themes/reimu/layouts/partials/header.html 第 23 行，
#      以及 sidebar/commonBar.html 第 69、88 行）：键不存在就直接渲染成空白，
#      没有「查不到就显示键名」的回退 —— 所以菜单里出现的每个 name，
#      i18n/zh-CN.yml 里都必须有一条同名键。
#
#      · 改栏目叫法：进「站点设置 → 站点文案」，改那条键的值。
#        例如把 archives 的值从「归档」改成「文章归档」，导航上就显示「文章归档」，
#        下面的 [[menu]] 一个字都不用动。
#      · 加新栏目：先在「站点文案」点添加、新增一行（键名用英文，如 projects；
#        值写要显示的文字，如 项目），再回「站点设置 → 菜单」新增一项，
#        名称填 projects、链接填 /projects/。两步顺序不能反。
#        直接在这里把 name 写成中文（如「项目」）在网页上是空白。
#      · 只改链接 / 图标 / 顺序：直接改下面这几项即可。
#
#    url 写相对路径（开头带不带 / 都行，主题会自己解析），空串 "" 或 "/" 都表示
#    站点根目录；不要在 url 里写域名。icon 留空 = 用主题默认图标。
#    数组顺序 = 网页上从左到右的顺序。
# ==============================================================================

# ---------------------------------------------------------------- 个人信息

# 作者名：页脚版权、侧边栏作者名、<title> 后缀都用它
author = "WuSi"

# 作者邮箱：目前只用于 RSS（/index.xml）的 author 字段；留空即可
email = ""

# 站点简介：侧边栏作者名下方那行字，同时是 <meta name="description"> 的兜底
description = "BAKA DA☆ZE!"

# 头像文件名：图片放在 static/avatar/ 下，这里只写文件名
avatar = "avatar.webp"

# 社交链接：当前为空（页面上不显示任何社交图标）。
# name 用主题支持的图标名：github / bilibili / zhihu / weibo / email / qq /
#   twitter / telegram / youtube / steam ...（写错不会报错，只是不显示图标）
social = []

# ---------------------------------------------------------------- 菜单
# ⚠️ name 是 i18n 键名，不是显示文字！文字在 i18n/zh-CN.yml（后台「站点文案」），
#    改法见本文件开头的「菜单怎么改」。当前对应关系：
#      home=首页  archives=归档  categories=分类  tags=标签  friend=友链  about=关于
[[menu]]
name = "home"
url = "/"
icon = ""

[[menu]]
name = "archives"
url = "archives"
icon = ""

[[menu]]
name = "categories"
url = "categories"
icon = ""

[[menu]]
name = "tags"
url = "tags"
icon = ""

[[menu]]
name = "friend"
url = "friend"
icon = ""

[[menu]]
name = "about"
url = "about"
icon = ""

# ---------------------------------------------------------------- 首页分类卡片
# 只写「已经存在」的分类（分类由文章的 categories 自动生成）；
# 这里没列出的分类不会显示卡片，但分类页 /categories/ 依旧可以访问。
[home_categories]
enable = true

[[home_categories.content]]
categories = "STM32"
cover = "images/stm32/interrupt-path.webp"
