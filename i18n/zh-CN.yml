# ==============================================================================
# 站点文案（简体中文）—— 项目级 i18n 表
#
# 导航栏每个栏目显示什么文字，取决于本文件里有没有【与菜单项 name 同名的键】：
#   主题模板是 {{ i18n .name }}（见 themes/reimu/layouts/partials/header.html 第 23 行），
#   键不存在就直接渲染成空白，没有「查不到就显示键名」的回退。
#   —— 所以「菜单里出现的每个 name，本文件里都必须有一条同名键」。
#
# 与主题的关系：Hugo 会把本文件与 themes/reimu/i18n/zh-CN.yml 【按单条键合并】，
#   本文件没写的键（页脚「基于」、上一篇/下一篇、阅读量、文章目录……）继续用主题里的中文，
#   本文件写了的键以本文件为准（改这里的值 = 给导航栏目改名）。
#   已实测：只写下面 6 个键时，页脚/翻页/侧边栏文案不缺失、不变英文。
#
# 后台入口：「站点设置 → 站点文案」（字段定义见 static/admin/config.yml 的 strings 集合）。
#   ⚠️ 后台保存会按表单内容重写整个文件，本文件的注释会被抹掉，属正常现象。
#   ⚠️ 键不要漏：漏一个，对应的导航栏目文字就是空白。
#
# 下面 6 条对应 config/_default/params.toml 里的 6 个菜单项。
# ==============================================================================

