name: Build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # 读本仓库的 workflow run 状态（右下角「构建状态」挂件用）

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.104.0
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      NODE_VERSION: 24.20.0
      TZ: Asia/Shanghai # 可根据需要修改时区
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive # 获取主题等子模块
          fetch-depth: 0
          lfs: false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local" >> "${GITHUB_PATH}"

      - name: Collect build status
        # 把两个工作流的最近结论写进 data/build_status.yml，Hugo 会把它
        # 渲染成 /build-status.json（右下角「构建状态」挂件）。
        # 脚本内部全程兜底：拿不到状态就写 unknown，绝不会让这一步失败。
        if: always()
        run: |
          python3 .github/scripts/write_build_status.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --token "${GITHUB_TOKEN}" \
            --out data/build_status.yml

      - name: Build with Hugo
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署结果只有到这一步才知道。如果这次部署失败，就用同一个 run id 重查一次结论，
      # 生成只含一个 build-status.json 的补丁 artifact 再发一次，把挂件里的状态纠正成
      # 「失败」；成功时这一步不会执行，走 build 阶段上传的完整 artifact。
      # 重发 artifact 不会清空站点：GitHub Pages 的 artifacts 是累加的。
      - name: Correct build status if deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/write_build_status.py \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --token "${GH_TOKEN}" \
            --out build-status-patch/build-status.json

      - name: Upload build status patch
        if: failure()
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build-status-patch

      - name: Publish build status patch
        if: failure()
        uses: actions/deploy-pages@v4