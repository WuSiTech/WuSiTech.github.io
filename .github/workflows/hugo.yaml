name: Build and deploy
on:
  # github.io 随 push 即时构建（Actions 对公开仓库免费、无分钟数上限）。
  push:
    branches:
      - main
  # 定时构建：每 2 小时一次（UTC 偶数点整 = 北京时间偶数点整）。
  # github.io 随 push 即时构建（Actions 免费无限）；Cloudflare Pages 只在定时任务里触发，见文末。
  schedule:
    - cron: '0 */2 * * *'
  # 需要立刻发布时，在 Actions 页面手动运行本工作流（Run workflow）。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.104.0
      GO_VERSION: 1.27.0
      HUGO_VERSION: 0.166.0
      NODE_VERSION: 24.20.0
      TZ: Asia/Shanghai # 可根据需要修改时区
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive # 获取主题等子模块
          # ⚠️ 必须是 1，不能是 0：fetch-depth: 0 会把**所有分支**都拉下来，
          # 包括 media 分支那 113MB 图片 —— 那样每次构建都要重新下载，缓存也白设。
          # 站点构建不需要 git 历史（没有用 enableGitInfo / .GitInfo，lastmod 都是手写的）。
          # 图片池由下面三步按需拉取。
          fetch-depth: 1
          lfs: false

      # ---------- 图片池：main 不含大图，构建时从 media 孤儿分支拉 ----------
      # 374 张封面原图 + 10 张背景图放在 media 分支（见 media.lock），三步处理：
      #   1) 用 media 最新提交哈希当缓存键；
      #   2) 命中缓存 → static/images/pool 直接可用，构建时间不变；
      #   3) 缓存未命中（media 变了 / 首次构建）才真的 fetch + worktree，多花 1~2 分钟。
      # 注意：镜像/索引类步骤全在缓存之后，缓存命中时不会白跑。
      - name: 解析 media 分支版本
        id: media
        run: |
          SHA="$(git ls-remote origin media | cut -f1)"
          if [ -z "${SHA}" ]; then
            echo "::error::取不到 origin/media 分支：图片池是构建的必需输入，请确认 media 分支存在且可读"
            exit 1
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: 缓存图片池
        uses: actions/cache@v4
        with:
          path: static/images/pool
          key: media-${{ steps.media.outputs.sha }}

      - name: 拉取图片池（缓存未命中才执行）
        run: |
          if [ -d static/images/pool/covers ]; then
            echo "缓存命中：图片池已就绪（$(find static/images/pool -type f | wc -l) 个文件）"
            exit 0
          fi
          git fetch origin media --depth=1
          rm -rf "${RUNNER_TEMP}/media"
          # 用 FETCH_HEAD 而不是 origin/media：actions/checkout 的浅克隆把
          # remote.origin.fetch 收窄成了当前分支，fetch 一个别的分支不会创建
          # refs/remotes/origin/media（只写 FETCH_HEAD），写成 origin/media 会报
          # "invalid reference"。
          git worktree add "${RUNNER_TEMP}/media" FETCH_HEAD
          mkdir -p static/images/pool
          cp -r "${RUNNER_TEMP}/media/images/pool/." static/images/pool/
          echo "已拉取图片池：$(find static/images/pool -type f | wc -l) 个文件"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Create a local tools directory
        run: |
          mkdir -p "${HOME}/.local"

      - name: Install Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Dart Sass
        run: |
          echo "Installing Dart Sass ${DART_SASS_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local" -xf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local" >> "${GITHUB_PATH}"

      - name: Mirror workflow badges
        # 页底「BLOG状态」固定条引用的是 static/badges/*.svg（README 顶部那两张
        # GitHub Actions 徽章的镜像）。这里在 hugo 之前把最新的徽章拉下来覆盖，
        # 让本地图片和 README 上的徽章保持同一个结论。
        # 脚本内部全程兜底：拿不到就保留仓库里已提交的那份并打 warning，
        # 永远 exit 0，再加上 continue-on-error，绝不会卡住构建。
        if: always()
        continue-on-error: true
        run: |
          mkdir -p static/badges
          python3 .github/scripts/fetch_badges.py \
            --token "${GITHUB_TOKEN}" \
            --out-dir static/badges
      - name: Build with Hugo
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 部署失败时「补发 build-status.json」的机制已随该文件一起删除：
      # 现在页底状态来自 GitHub 官方徽章 SVG 本身（static/badges/*.svg），
      # 工作流失败时徽章下一次读取就会变成 failing，不需要补发 artifact。

      # 站点部署完成后，再触发 Cloudflare Pages 构建（它不再跟随 push 自动构建）。
      # 需要在仓库 Secrets 里配置 CF_DEPLOY_HOOK（Cloudflare Pages → Settings → Deploy hooks）。
      - name: Trigger Cloudflare Pages build
        # 只在定时任务里触发，避免每次 push 都消耗 Cloudflare 的构建配额
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "未配置 CF_DEPLOY_HOOK，跳过"
            exit 0
          fi
          curl -s -X POST "$HOOK" -o /dev/null -w "CF Pages hook HTTP %{http_code}\n"
