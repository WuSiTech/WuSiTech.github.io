name: 同步封面池

# ---------------------------------------------------------------------------
# media 分支只放图片（374 张封面原图 + 10 张背景图），main 分支构建时由
# .github/workflows/hugo.yaml 把图片池拉到 static/images/pool 再打包，见 media.lock。
#
# 这个工作流负责「media 一变，后台封面下拉框就跟着变」：
#   1. 用 GitHub Git Tree API 列出 media 分支 images/pool/covers/ 下的全部 .webp/.avif
#   2. 生成 data/cover_pool.yml（站内路径清单）
#   3. 替换 static/admin/config.yml 里 COVER_OPTIONS_BEGIN / COVER_OPTIONS_END
#      两条标记行之间的内容（后台「封面图」下拉框的选项），标记区以外不动
#   4. 用 GITHUB_TOKEN 把这两处改动提交回 main
#   5. 再显式 gh workflow run 触发一次 hugo.yaml —— media 分支的 push 不会触发它
#      （它只监听 main），而用 GITHUB_TOKEN 推的提交也不会自动触发别的 workflow，
#      不显式触发的话新图片永远不会被构建进 public/。
#
# ⚠️ push 事件用的是「被推送的那个提交里的工作流文件」：本文件必须在 media
#    分支上也有同样一份，否则往 media 推图片时根本不会触发。建 media 分支时
#    已经带上了这个文件；以后改这里，记得同步一份到 media 分支。
# ---------------------------------------------------------------------------
on:
  push:
    branches: [media]
  # 需要手动重跑（例如工作流失败后补一次）时用
  workflow_dispatch:

permissions:
  contents: write # 要把清单提交回 main
  actions: write # 需要 gh workflow run 显式触发一次构建部署（见文末）

concurrency:
  group: sync-cover-pool
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成封面清单（Git Tree API 列 media 分支）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/sync_cover_pool.py --from-git-tree

      - name: 提交并推送（有变化才提交）
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "committed=false" >> "${GITHUB_OUTPUT}"
          # 只暂存这两处（绝不用 git add -A）
          git add data/cover_pool.yml static/admin/config.yml
          if git diff --cached --quiet; then
            echo "清单没有变化，跳过提交"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "自动同步封面池：来源 media 分支"
          # 可能和站长的提交撞车；rebase 后最多重试 3 次
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "committed=true" >> "${GITHUB_OUTPUT}"
              echo "已推送新清单到 main"
              exit 0
            fi
            echo "推送失败（第 ${attempt} 次），rebase 后重试"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          echo "::error::连续 3 次推送失败，请检查分支保护规则或手动 push"
          exit 1

      # media 分支的 push 不会触发 hugo.yaml（它只监听 main）；而用 GITHUB_TOKEN
      # 推的提交按 GitHub 的规则也不会自动触发其他工作流。所以新图片要上线，
      # 必须在这里显式请求一次构建部署（webp.yml 里也是这个套路）。
      - name: 请求一次构建部署（新图片才会出现在线上）
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run hugo.yaml --ref main -R "${GITHUB_REPOSITORY}"; then
            echo "已请求 Build and deploy 重新构建（含本次 media 变更的图片）"
          else
            echo "::warning::自动触发部署失败，请到 Actions 手动运行 Build and deploy"
          fi

      - name: 汇总
        if: always()
        run: |
          {
            echo "### 同步封面池"
            echo '```'
            git status --short | head -20
            echo '```'
            if [ -f data/cover_pool.yml ]; then
              echo "data/cover_pool.yml 行数：$(grep -c '^- /images/pool/covers/' data/cover_pool.yml || true)"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
