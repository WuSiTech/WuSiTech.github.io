name: Tools and config checks

# 这个工作流不部署站点（部署是 hugo.yaml 的事），只做四件自检：
#   1. Python 工具能否正常跑、mock 测试是否通过（含徽章镜像脚本的语法/用法自检）
#   2. 后台登录中转 Worker 的 12 项自测
#   3. Hugo 能否构建（含 data/config 改动是否合法）+ vendor 库有没有回退到外部 CDN
#   4. 构建产物里断链 / 外部资源 / sitemap / 首页导航检查

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'data/**'
      - 'config/**'
      - 'static/admin/**'
      - 'static/badges/**'
      - 'static/resources/**'
      - 'static/css/**'
      - 'static/js/**'
      - 'layouts/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tools:
    name: Python 工具自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 准备 Python 依赖
        # img2webp.py 在导入阶段就需要 Pillow（缺了会直接退出），
        # 用 venv 避免新版 Ubuntu runner 的 PEP 668「externally managed」限制
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet Pillow
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: 语法检查
        run: |
          # 自动收集仓库里所有 Python 文件（避免清单里残留已删除的脚本）
          python3 -m py_compile $(git ls-files "tools/*.py" ".github/scripts/*.py")

      - name: CLI 冒烟测试（--help）
        run: |
          python3 tools/docx2md.py --help > /dev/null
          python3 tools/img2webp.py --help > /dev/null
          python3 tools/auto_webp.py --help > /dev/null
          python3 tools/localize_vendor.py --help > /dev/null
          python3 tools/fetch_media_pool.py --help > /dev/null
          python3 tools/check_twikoo.py > /dev/null || test $? -eq 2   # 不带参数应打印用法并以 2 退出

      - name: Twikoo 自检工具的 mock 测试（4 个场景）
        run: python3 tools/test_check_twikoo.py

      - name: auto_webp 自测（转换 / 跳过 / 引用改写 / 删除原图的规则）
        run: python3 tools/test_auto_webp.py

      - name: vendor 库不得回退到外部 CDN
        run: python3 tools/localize_vendor.py --dry-run --strict

  worker:
    name: 后台登录中转自测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 运行 Worker 自测（12 项：正常回调 + 各类攻击场景）
        run: node tools/cms-oauth-worker/test.mjs

  build:
    name: Hugo 构建检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # 不要 fetch-depth: 0 —— 那会把 media 分支的 113MB 图片也一起拉下来。
          # 这个 job 只需要「当前提交」+ 下面按需拉取的图片池。
          fetch-depth: 1

      # ---------- 图片池（media 分支）：与 hugo.yaml 同样的三步 ----------
      # 清单 data/covers.yml 里引用了 374 张封面，产物校验（断链检查）需要它们真的存在，
      # 所以这里也必须先把图片池拉到 static/images/pool。
      - name: 解析 media 分支版本
        id: media
        run: |
          SHA="$(git ls-remote origin media | cut -f1)"
          if [ -z "${SHA}" ]; then
            echo "::error::取不到 origin/media 分支：图片池是构建的必需输入"
            exit 1
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: 缓存图片池
        uses: actions/cache@v4
        with:
          path: static/images/pool
          key: media-${{ steps.media.outputs.sha }}

      - name: 拉取图片池（缓存未命中才执行）
        run: |
          if [ -d static/images/pool/covers ]; then
            echo "缓存命中：图片池已就绪（$(find static/images/pool -type f | wc -l) 个文件）"
            exit 0
          fi
          git fetch origin media --depth=1
          rm -rf "${RUNNER_TEMP}/media"
          # 用 FETCH_HEAD：浅克隆的 remote.origin.fetch 只映射当前分支，
          # fetch 别的分支不会生成 refs/remotes/origin/media（理由同 hugo.yaml）。
          git worktree add "${RUNNER_TEMP}/media" FETCH_HEAD
          mkdir -p static/images/pool
          cp -r "${RUNNER_TEMP}/media/images/pool/." static/images/pool/
          echo "已拉取图片池：$(find static/images/pool -type f | wc -l) 个文件"

      - name: 安装 Dart Sass（主题编译 SCSS 需要）
        run: |
          DART_SASS_VERSION=1.104.0
          curl -sfL --output-dir "${RUNNER_TEMP}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          mkdir -p "${HOME}/.local"
          tar -C "${HOME}/.local" -xf "${RUNNER_TEMP}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"

      - name: 安装 Hugo Extended
        run: |
          HUGO_VERSION=0.166.0
          curl -sfL --output-dir "${RUNNER_TEMP}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local" -xf "${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          "${HOME}/.local/hugo" version

      - name: 构建（只验证，不部署）
        run: '"${HOME}/.local/hugo" --minify --baseURL https://wusitech.github.io/'

        # 挂件状态是构建期写进 /build-status.json 的，这一步防止模板被改坏后静默消失

      - name: 校验构建产物（断链 / 外部资源 / sitemap）
        run: python3 tools/check_site.py --dir public
